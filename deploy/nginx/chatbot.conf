# Configuration Nginx pour Déploiement en Production
# Remplacer "votre-domaine.com" par votre nom de domaine ou IP publique.

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votre-domaine.com;

    # Certificats SSL (générés par Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/votre-domaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Taille max des uploads (fichiers PDF / documents pour le RAG)
    client_max_body_size 50M;

    # Racine des fichiers statiques compilés (build Vite)
    root /var/www/chatbot/dist;
    index index.html;

    # 1. Routes API / SSE / Backend vers Gunicorn (Flask)
    location ~ ^/(chat-sse|api|documents|empty-documents|history|rag|status) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuration critique pour le Streaming SSE (Server-Sent Events)
        # Empêche la mise en mémoire tampon afin que les tokens soient transmis en temps réel
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        chunked_transfer_encoding off;
    }

    # 2. Cache statique pour les assets immutables Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # 3. Application SPA Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }
}
